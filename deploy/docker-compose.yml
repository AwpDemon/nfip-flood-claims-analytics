# Not deployed anywhere yet. Local run:  docker compose -f deploy/docker-compose.yml up --build
services:
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    restart: unless-stopped
