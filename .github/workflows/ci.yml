name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check src tests app scripts
          ruff format --check src tests app scripts
      - name: dbt parse (project compiles)
        env:
          NFIP_RAW_DIR: ${{ github.workspace }}/tests/fixtures/raw
          NFIP_DUCKDB_PATH: ${{ runner.temp }}/ci.duckdb
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        working-directory: dbt
        run: dbt parse
      - name: pytest (unit tests + dbt build on the real-data fixture)
        env:
          NFIP_DUCKDB_MEMORY: 1GB
        run: pytest -q
